version: '3.8'

services:
    redis:
        image: redis/redis-stack
        ports:
            - "16379:6379"
        volumes:
            - ./data:/data

    app:
        build:
            context: .
            dockerfile: DockerfileLocal
        ports:
            - "8000:8000"
        volumes:
            - ./app:/app
        depends_on:
            - redis
        command: [ "uvicorn", "main:app", "--proxy-headers", "--host", "0.0.0.0", "--port", "8000", "--reload" ]

    test:
        build:
            context: .
            dockerfile: DockerfileLocal
        volumes:
            - ./tests:/tests
        depends_on:
            - redis
        entrypoint: [ "pytest" ]
